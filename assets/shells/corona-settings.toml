[shell]
avatar = "/nix/store/f3sxsgdq9vdpih309c92ai6yg6b62jya-profilepicture.png"

[shell.animation]
enabled = true
speed = 1.0

[shell.privacy]
mic_filter_regex = "gsr-alsa_input|gsr-default_output"
cam_filter_regex = ""
screen_filter_regex = ""

[theme]
name = "shadcn Zinc Blue Dark"
font_scale = 1.0
corner_radius_scale = 1.0
shadow = true
popup_borders = true
card_borders = true
screen_corners = true

[wallpaper]
path = "https://profidev.io/api/services/apod/random"

[bar.main]
position = "top"
thickness = 30.0
background_opacity = 1.0
capsule = true
widget_spacing = 8.0
padding_start = 5.0
padding_end = 5.0

[[bar.main.start]]
widget_type = "workspaces"

[[bar.main.start]]
widget_type = "active_window"

[[bar.main.center]]
widget_type = "clock"

[[bar.main.center]]
widget_type = "player"

[[bar.main.end]]
widget_type = "privacy"

[[bar.main.end]]
widget_type = "tray"

[bar.main.end.options]
blacklist = [
    "spotify",
    "vicinae",
    "udiskie",
]

[[bar.main.end]]

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "cpu"

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "temperature"

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "memory"

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "download"

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "upload"

[[bar.main.end.group]]
widget_type = "resource"

[bar.main.end.group.options]
stat = "disk"

[[bar.main.end]]
widget_type = "kdeconnect:phone"

[[bar.main.end]]
widget_type = "tailscale:tailscale"

[[bar.main.end]]
widget_type = "homeassistant:home"

[[bar.main.end]]
widget_type = "battery"

[[bar.main.end]]
widget_type = "bluetooth"

[[bar.main.end]]
widget_type = "network"

[[bar.main.end]]
widget_type = "audio"

[[bar.main.end]]
widget_type = "notifications"

[[bar.main.end]]
widget_type = "control_center"

[notification]
enabled = true
position = "top_right"
width = 400.0
offset = 20.0
timeout_ms = 5000
critical_timeout_ms = 10000
background_opacity = 1.0
filter_regex = "sensoren werden aktualisiert"

[notification.battery]
enabled = true
low_percent = 20
critical_percent = 5

[osd]
enabled = true
hide_delay_ms = 1500
position = "bottom_center"
offset = 40.0
background_opacity = 1.0

[osd.kinds]
volume = true
brightness = true
wifi = true
bluetooth = true
dnd = true
power_profile = true
privacy = true
keyboard_layout = true
lock_keys = true

[lockscreen]
lock_before_suspend = true
blur = 3.0
monitor = "DP-1"

[screenshot]
filename_pattern = "screenshot-%Y-%m-%d-%H%M%S-%3f.png"

[window_switcher]
current_monitor_only = false
card_height = 180.0
backdrop_opacity = 0.4

[launcher]
close_on_unfocus = true
width = 800.0
height = 520.0
terminal = ""
preview = true
section_limit = 5
search_engine = "g"
fallbacks = [
    "web",
    "files",
    "terminal",
]
quicklinks = []
snippets = []
close_all_exclude = []
currency_refresh_hours = 24

[[launcher.search_engines]]
keyword = "g"
name = "Google"
url = "https://www.google.com/search?q={query}"

[[launcher.search_engines]]
keyword = "ddg"
name = "DuckDuckGo"
url = "https://duckduckgo.com/?q={query}"

[[launcher.search_engines]]
keyword = "yt"
name = "YouTube"
url = "https://www.youtube.com/results?search_query={query}"

[[launcher.search_engines]]
keyword = "gh"
name = "GitHub"
url = "https://github.com/search?q={query}"

[[launcher.search_engines]]
keyword = "wiki"
name = "Wikipedia"
url = "https://en.wikipedia.org/wiki/Special:Search?search={query}"

[launcher.commands]

[launcher.files]
roots = ["~"]
excludes = [
    "node_modules",
    "target",
    ".git",
    ".cache",
]
hidden = false
respect_ignore = true

[launcher.clipboard]
enabled = true
images = true
image_max_mb = 10.0
image_retention_days = 30

[launcher.translate]
target = "EN"

[taskbar]
enabled = true
icon_size = 36.0
previews = true
preview_max_windows = 5
background_opacity = 1.0

[osk]
enabled = true
auto_show = "tablet_mode"
tablet_source = "hinge"
layout = "auto"
language = "auto"
suggestions = true
spell_check = true
learn_words = true

[control_center]
time_format = "%H:%M"
date_format = "%a, %d.%m.%Y"
week_start = "monday"
background_opacity = 1.0
sidebar = [
    "audio",
    "network",
    "hotspot",
    "bluetooth",
    "printers",
    "disks",
    "power",
    "brightness",
    "displays",
    "notifications",
    "clipboard",
    "sysinfo",
    "weather",
    "calendar",
    "media",
]
quick_actions = [
    "wifi",
    "bluetooth",
    "dnd",
    "dark_mode",
    "stay_awake",
    "airplane",
]

[weather]
units = "metric"
refresh_minutes = 30

[location]
city = "Bad Aibling, Germany"
auto_locate = false

[brightness]
enable_ddcutil = true
poll_seconds = 5

[nightlight]
mode = "manual"
temperature = 4000
start = "20:00"
end = "07:00"
transition_minutes = 30

[system.monitor]
poll_seconds = 3

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 600.0
command = ""
resume_command = ""

[idle.behavior.lock-and-suspend]
enabled = true
action = "lock_and_suspend_then_hibernate"
timeout = 900.0
command = ""
resume_command = ""

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 660.0
command = ""
resume_command = ""

[plugins]
enabled = [
    "tailscale",
    "kdeconnect",
    "homeassistant",
]
auto_update = "official"

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/ProfiiDev/corona-plugins"
enabled = true

[[plugins.source]]
name = "dev"
kind = "dev"
location = "/home/jojowaldi/Coding/hyprland/corona-plugins"
enabled = false

[plugins.approved.homeassistant]
source = "official"
capabilities = """
corona = ["secrets"]

[network]
lan_hosts = ["${setting:url}"]
"""

[plugins.approved.kdeconnect]
source = "official"
capabilities = """
corona = ["desktop"]

[dbus]
session = ["org.kde.kdeconnect"]

[fs]
execute = ["adb", "scrcpy"]

[process]
env = ["PATH", "HOME", "XDG_RUNTIME_DIR", "WAYLAND_DISPLAY", "DISPLAY"]
"""

[plugins.approved.tailscale]
source = "official"
capabilities = """
corona = ["desktop"]

[clipboard]
write = true

[fs]
execute = ["tailscale"]

[network]
unix = ["/run/tailscale/tailscaled.sock"]

[process]
env = ["PATH"]
"""

[plugin_settings.homeassistant]
url = "https://home.jojowaldi.com"
entities = ["camera.reolink_04"]

[plugin_settings.kdeconnect]
recordings = "/home/jojowaldi/Videos"

[plugin_settings.tailscale]
downloads = "/home/jojowaldi/Downloads"
